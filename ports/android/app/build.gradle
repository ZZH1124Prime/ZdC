plugins {
    id 'com.android.application' version '8.7.3'
}

def uiDir = layout.buildDirectory.dir('generated/zdcUi')
def iconDir = layout.buildDirectory.dir('generated/zdcResources')
def webManifest = file('../../shared/web-assets.list')
def webFiles = webManifest.readLines('UTF-8').collect { rootProject.file('../../' + it) }
def ui = tasks.register('prepareZdCUi', Sync) {
    from(webFiles)
    duplicatesStrategy = DuplicatesStrategy.FAIL
    doFirst {
        webFiles.each { source ->
            if (!source.isFile()) throw new GradleException("Missing web asset: ${source}")
        }
    }
    into uiDir
}
def icon = tasks.register('prepareZdCIcon', Sync) {
    from('../../shared/launcher.png') { into 'drawable-nodpi' }
    into iconDir
}

android {
    namespace 'org.zdc.app'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'org.zdc.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0-preview1'
        resValue 'string', 'web_asset_names', webFiles.collect { it.name }.join('\\n')
    }
    sourceSets.main.assets.srcDir(uiDir)
    sourceSets.main.res.srcDir(iconDir)
    testOptions.unitTests.includeAndroidResources = true
}
tasks.named('preBuild') { dependsOn ui, icon }

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
